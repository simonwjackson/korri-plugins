name: Check ZQuest Classic plugin

on:
  push:
    branches: [main]
    paths:
      - plugins/zquest-classic/**
      - nix/zquest-*
      - nix/default.nix
      - flake.nix
      - flake.lock
      - .github/workflows/zquest-classic.yml
  pull_request:
    paths:
      - plugins/zquest-classic/**
      - nix/zquest-*
      - nix/default.nix
      - flake.nix
      - flake.lock
      - .github/workflows/zquest-classic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          install_url: https://releases.nixos.org/nix/nix-2.34.1/install
      - name: Check native player, plugin contract, input and save reload
        run: nix build --no-link .#checks.${{ matrix.system }}.korri-zquest-classic-plugin --print-build-logs
