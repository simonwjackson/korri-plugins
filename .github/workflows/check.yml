name: Check portable plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          install_url: https://releases.nixos.org/nix/nix-2.34.1/install
      - name: Check the real pack and generated manifest
        run: nix build --no-link .#checks.${{ matrix.system }}.pico8-starter-pack --print-build-logs
      - name: Check Fallout packages, native architecture, admission and sandboxed launch without retail assets
        run: nix build --no-link .#checks.${{ matrix.system }}.korri-fallout1-ce-plugin .#checks.${{ matrix.system }}.korri-fallout2-ce-plugin --print-build-logs
      - name: Check 2 Ship package, admission and sandboxed launch without retail assets
        run: nix build --no-link .#checks.${{ matrix.system }}.korri-2ship-plugin --print-build-logs
      - name: Check SMW package, admission and sandboxed launch without retail assets
        run: nix build --no-link .#checks.${{ matrix.system }}.korri-super-mario-world-plugin --print-build-logs
      - name: Check OpenGOAL runtime, preparation failures and sandboxed launch without retail assets
        if: matrix.system == 'x86_64-linux'
        run: nix build --no-link .#checks.x86_64-linux.korri-opengoal-plugin --print-build-logs
